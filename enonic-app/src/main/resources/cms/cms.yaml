kind: "CMS"
# Site configuration, shown when an editor adds the app to a site in Content Studio.
# Checkboxes are phrased so that "unchecked" (which XP stores as a missing property) is the safe default.
form:
  - type: "RadioButton"
    name: "source"
    label: "Where agents read the content from"
    helpText: "Rendered pages works on any site: agentprose reads the page and this app's site index (/agentprose.json). Guillotine reads published content through the Guillotine GraphQL API (install Guillotine and mount it on this site)."
    occurrences:
      min: 1
      max: 1
    options:
      - value: "pages"
        label: "Rendered pages (any site)"
      - value: "guillotine"
        label: "Guillotine GraphQL API (headless)"
    default: "pages"
  - type: "TextLine"
    name: "contentType"
    label: "Guillotine: content type of articles"
    helpText: "For example com.example.myapp:article. Needed when reading from Guillotine."
  - type: "TextLine"
    name: "endpoint"
    label: "Guillotine: GraphQL endpoint (optional)"
    helpText: "Leave empty to use this site's own /_/com.enonic.app.guillotine:graphql. Add the API to the site in its descriptor or with a site mapping."
  - type: "TextLine"
    name: "urlPattern"
    label: "Guillotine: article URL pattern (optional)"
    helpText: "Only if Guillotine cannot return page URLs, for example /blog/{slug}/."
  - type: "TextLine"
    name: "contentSelector"
    label: "CSS selector of the article body (optional)"
    helpText: "For rendered pages. Default: main, article or the largest text block."
  - type: "TextLine"
    name: "indexTypes"
    label: "Rendered pages: content types to list (optional)"
    helpText: "Which content the site index (/agentprose.json) lists, for example com.example.myapp:article. Default: every page-like content in the site (no folders, media or templates)."
    occurrences:
      min: 0
      max: 0
  - type: "CheckBox"
    name: "noIndex"
    label: "Rendered pages: do not publish /agentprose.json"
  - type: "TextLine"
    name: "prefix"
    label: "Tool name prefix (optional)"
    helpText: "Prepended to every tool name, for example mysite_."
  - type: "CheckBox"
    name: "navigate"
    label: "Let agents open pages (navigate tool)"
  - type: "TextLine"
    name: "subscribe"
    label: "Newsletter / subscribe URL (optional)"
  - type: "TextLine"
    name: "about"
    label: "About page URL (optional)"
  - type: "TextLine"
    name: "contact"
    label: "Contact page URL (optional)"
  - type: "TextLine"
    name: "cloudKey"
    label: "agentprose Cloud site key (optional)"
    helpText: "A pk_ key from agentprose.cloud turns on usage analytics and hosted search. Nothing is sent anywhere without it."
  - type: "CheckBox"
    name: "noCloudSearch"
    label: "With a Cloud key: keep search local (no hosted search)"
  - type: "CheckBox"
    name: "noPolyfill"
    label: "Do not load the bundled WebMCP polyfill for browsers without WebMCP"
  - type: "CheckBox"
    name: "inspector"
    label: "Show the agentprose inspector in Content Studio preview"
  - type: "CheckBox"
    name: "debug"
    label: "Log to the browser console (debug)"
