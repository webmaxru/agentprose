name: WordPress plugin
on:
  push:
    branches: [main]
    paths: ['wordpress-plugin/**', '.github/workflows/wordpress-plugin.yml']
  pull_request:
    paths: ['wordpress-plugin/**', '.github/workflows/wordpress-plugin.yml']
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.6']
    defaults:
      run:
        working-directory: wordpress-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax lint (${{ matrix.php }})
        run: for f in $(find agentprose -name '*.php'); do php -l "$f"; done

  phpcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-plugin
    steps:
      - uses: actions/checkout@v4
      - name: Plugin version, AGENTPROSE_VERSION and Stable tag agree
        run: node sync.mjs --check
      - name: PHP lint (7.4+ syntax, runner PHP)
        run: for f in $(find agentprose -name '*.php'); do php -l "$f"; done
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
